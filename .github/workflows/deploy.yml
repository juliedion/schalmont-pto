name: Deploy to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # lets the daily lunch-menu job deploy its update

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      # The homepage search box reads data/search-index.json; rebuild it from the pages
      # being deployed so new and edited pages are searchable right away.
      - name: Build the homepage search index
        run: python3 tools/build_search_index.py

      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-v2.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            *.md
            .DS_Store
            **/.DS_Store

      - name: Fix file permissions
        run: curl -s "https://schalmontpto.com/fix-permissions.php?token=schalmontpto2026fix"
