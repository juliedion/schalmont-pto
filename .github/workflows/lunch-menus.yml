name: Update lunch menus

# Every morning, re-read the district's lunch-menu PDFs and rebuild data/lunch-menus.json
# (see tools/lunch_menus.py). When the menus changed, commit the file and deploy the site.
on:
  schedule:
    - cron: "15 9 * * *"     # 5:15 AM Eastern (4:15 in winter) -- before families check
  workflow_dispatch: {}       # "Run workflow" button on GitHub, for a new month's menu right away

permissions:
  contents: write             # commit data/lunch-menus.json
  actions: write              # start the deploy workflow

concurrency:
  group: lunch-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the menus
        run: |
          pip install --quiet pdfplumber
          python tools/lunch_menus.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/lunch-menus.json && [ -z "$(git status --porcelain -- data/lunch-menus.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "lunch-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lunch-menus.json
          git commit -m "Update lunch menus"
          git pull --rebase --autostash
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made by this workflow doesn't start other workflows on its own,
      # so kick off the normal deploy explicitly.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
