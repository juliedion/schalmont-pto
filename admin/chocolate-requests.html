<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTO Back Office Chocolate Requests</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/styles.css?v=6">
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="../images/favicon.svg">
  <style>
    table.cr-table { width:100%; border-collapse:collapse; font-size:13.5px; background:#fff; }
    table.cr-table th, table.cr-table td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    table.cr-table th { background:var(--light-bg); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-light); }
    table.cr-table select { padding:5px 7px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:12.5px; }
    .cr-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-lg); }
  </style>
</head>
<body>
  <div id="bo-loading">Loading…</div>
  <div id="bo-shell"></div>

  <main id="bo-main" style="display:none">
    <div style="margin-bottom:14px"><a class="bo-btn ghost sm" href="index.html">← Back Office Home</a></div>
    <h1 class="bo-h1">🍫 Chocolate Bar Fundraiser — Seller Requests</h1>
    <p class="bo-lead">Everyone who asked for chocolate to sell via schalmontpto.com/chocolate,
       newest first. Update status as you distribute and reconcile batches.</p>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 18px">
      <button class="bo-btn ghost sm" id="refresh-btn">↻ Refresh</button>
      <button class="bo-btn ghost sm" id="csv-btn">⬇ Download CSV</button>
      <label style="margin-left:auto;font-size:12px;font-weight:700;color:var(--text-light)">Status:
        <select id="status-filter" style="padding:7px 9px;border:1px solid var(--border);border-radius:7px">
          <option value="all">All</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="issued">Chocolate issued</option>
          <option value="reconciled">Reconciled</option>
        </select>
      </label>
    </div>

    <div class="cr-wrap"><table class="cr-table" id="cr-table">
      <thead><tr>
        <th>When</th><th>Parent</th><th>Student</th><th>School</th><th>Grade</th>
        <th>Email</th><th>Phone</th><th>Qty</th><th>Pickup</th><th>Notes</th><th>Status</th>
      </tr></thead>
      <tbody id="cr-body"><tr><td colspan="11" style="color:var(--text-light)">Loading…</td></tr></tbody>
    </table></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="admin-core.js"></script>
  <script>
    const STATUSES = ['new', 'contacted', 'issued', 'reconciled'];
    let rows = [];

    requireAdmin((me) => {
      if (!me.isSuper) { location.href = 'index.html'; return; }
      document.getElementById('refresh-btn').onclick = load;
      document.getElementById('csv-btn').onclick = downloadCSV;
      document.getElementById('status-filter').onchange = render;
      load();
    });

    async function load() {
      const body = document.getElementById('cr-body');
      body.innerHTML = '<tr><td colspan="11" style="color:var(--text-light)">Loading…</td></tr>';
      try {
        const snap = await db.collection('chocolate_seller_requests').get();
        rows = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
        render();
      } catch (e) {
        body.innerHTML = '<tr><td colspan="11" style="color:var(--error)">Could not load: ' + esc(e.message) + '</td></tr>';
      }
    }

    function render() {
      const filter = document.getElementById('status-filter').value;
      const body = document.getElementById('cr-body');
      const list = rows.filter(r => filter === 'all' || (r.status || 'new') === filter);
      if (!list.length) { body.innerHTML = '<tr><td colspan="11" style="color:var(--text-light)">No requests yet.</td></tr>'; return; }
      body.innerHTML = '';
      list.forEach(r => {
        const tr = document.createElement('tr');
        const when = r.at?.toDate ? r.at.toDate().toLocaleString() : '';
        tr.innerHTML = `
          <td>${esc(when)}</td>
          <td>${esc(r.parentName)}</td>
          <td>${esc(r.studentName)}</td>
          <td>${esc(r.school)}</td>
          <td>${esc(r.grade)}</td>
          <td>${r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ''}</td>
          <td>${r.phone ? `<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : ''}</td>
          <td>${esc(r.quantity)}</td>
          <td>${esc(r.pickup)}</td>
          <td style="max-width:220px">${esc(r.notes)}</td>
          <td></td>`;
        const sel = document.createElement('select');
        STATUSES.forEach(s => sel.add(new Option(s[0].toUpperCase() + s.slice(1), s, false, (r.status || 'new') === s)));
        sel.onchange = async () => {
          try { await db.collection('chocolate_seller_requests').doc(r.id).update({ status: sel.value }); r.status = sel.value; toast('Updated'); }
          catch (e) { toast('Could not update: ' + e.message, 'error'); }
        };
        tr.lastElementChild.appendChild(sel);
        body.appendChild(tr);
      });
    }

    function downloadCSV() {
      const head = ['When', 'Parent', 'Student', 'School', 'Grade', 'Email', 'Phone', 'Qty', 'Pickup', 'Notes', 'Status'];
      const out = rows.map(r => [
        r.at?.toDate ? r.at.toDate().toISOString() : '', r.parentName, r.studentName, r.school, r.grade,
        r.email, r.phone, r.quantity, r.pickup, r.notes, r.status || 'new'
      ]);
      const csv = [head].concat(out).map(row => row.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = 'chocolate-seller-requests.csv';
      a.click();
    }
  </script>
</body>
</html>
