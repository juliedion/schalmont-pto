<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Today at Schalmont — Schalmont PTO</title>
  <!-- For a DAKboard (or any wall display): just the homepage's top three cards -- letter days,
       lunch menus and weather -- as large cards stacked one above the other, at every screen
       width. Same scripts as the homepage (js/home.js), so it updates whenever they do. -->
  <link rel="stylesheet" href="css/styles.css?v=6">
  <link rel="stylesheet" href="css/home.css?v=24">
  <link rel="icon" href="images/favicon.svg">
  <style>
    html, body { margin: 0; }
    body.home2.dak { background: var(--hz-forest); min-height: 100vh; }
    /* Everything drawn 1.4x larger so it reads from across a room. */
    .dak .hz-wrap { zoom: 1.4; max-width: 820px; padding: 14px 20px 18px; }
    .dak .hz-band-head { margin: 2px 0 12px; }
    /* One card per row, full width (the homepage's smaller-screen rules are overridden here). */
    .dak .hz-dash { grid-template-columns: 1fr; gap: 16px; margin-top: 0; }
    .dak .hz-dash .hz-card { min-height: 0; padding: 18px 20px; }
    .dak .hz-dash .hz-card-letters { grid-column: auto; order: 0; }
    .dak .hz-ld-tile { min-height: 112px; padding: 10px 8px 9px; }
    .dak .hz-ld-tile .hz-ld-letter { font-size: 52px; }
    .dak .hz-ld-tile .hz-ld-school { font-size: 12px; }
    .dak .hz-wx-temp, .dak .hz-wx-icon { font-size: 44px; }
  </style>
</head>
<body class="home2 dak">
  <div class="hz-wrap">
    <div class="hz-band-head">
      <h2>Today at Schalmont <span id="hz-today-date"></span></h2>
    </div>
    <div class="hz-dash">

      <section class="hz-card hz-card-letters" aria-labelledby="hz-ld-title">
        <div class="hz-dash-head">
          <h3 class="hz-card-title" id="hz-ld-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            Letter Days
          </h3>
          <span class="hz-pill is-unknown" id="hz-ld-pill">Loading…</span>
        </div>
        <div id="hz-letters" aria-live="polite">
          <div class="hz-ld-tiles">
            <span class="hz-skel" style="height:96px;border-radius:14px"></span>
            <span class="hz-skel" style="height:96px;border-radius:14px"></span>
            <span class="hz-skel" style="height:96px;border-radius:14px"></span>
          </div>
        </div>
      </section>

      <section class="hz-card hz-card-lunch" id="hz-lunch" aria-labelledby="hz-lunch-title">
        <div class="hz-dash-head">
          <h3 class="hz-card-title" id="hz-lunch-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 2v8a2 2 0 0 0 4 0V2M9 10v12M17 2c-2 2-3 5-3 8h3v12"/></svg>
            School Lunch Menus
          </h3>
        </div>
        <div class="hz-tabs" role="tablist" aria-label="Choose a school" id="hz-lunch-tabs"></div>
        <div id="hz-lunch-panel" role="tabpanel" style="display:flex;flex-direction:column;flex:1"></div>
      </section>

      <section class="hz-card hz-card-weather" aria-labelledby="hz-wx-title">
        <div class="hz-dash-head">
          <h3 class="hz-card-title" id="hz-wx-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            Daily Weather
          </h3>
          <span class="hz-pill">Rotterdam, NY</span>
        </div>
        <div id="hz-weather" aria-live="polite">
          <span class="hz-skel" style="width:60%;height:40px;margin:6px 0 14px"></span>
          <span class="hz-skel" style="width:100%;height:56px"></span>
        </div>
      </section>

    </div>
  </div>

  <script src="js/home.js?v=26"></script>
  <script>
    // A wall display stays open for days: reload every 30 minutes, and just after midnight,
    // so the date, letter days, lunch and weather roll over on their own.
    (function () {
      var now = new Date(), midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 2);
      setTimeout(function () { location.reload(); }, Math.min(30 * 60000, midnight - now));
    })();
  </script>
</body>
</html>
