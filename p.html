<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Schalmont PTO">
  <meta property="og:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <title>Schalmont PTO</title>
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <link rel="stylesheet" href="/admin/admin.css?v=8">
  <link rel="icon" href="/images/favicon.svg">
  <style>
    .pg-preview-banner { background:#8a6d1a; color:#fff; text-align:center; font-weight:700;
      font-size:13px; padding:8px 14px; }
    .page-hero h1 { margin:0; }
    .page-hero p { margin:10px 0 0; }
    #pg-body { max-width:none; }
    .tot-flyers { display:grid; grid-template-columns:minmax(0, .7723fr) minmax(0, .7735fr) minmax(0, .6667fr); gap:18px; margin:18px 0 22px; align-items:start; }   /* widths ∝ each flyer's width/height, so all three are the same height */
    .tot-flyers figure { margin:0; text-align:center; }
    .tot-flyers img { width:100%; height:auto; display:block; border-radius:12px; cursor:zoom-in; box-shadow:0 4px 16px rgba(0,0,0,.15); }
    .tot-flyers figcaption { margin-top:10px; }
    .tot-flyers figcaption a { display:inline-block; font-weight:800; color:var(--primary); text-decoration:none; border:2px solid var(--primary); border-radius:999px; padding:7px 16px; }
    .tot-flyers figcaption a:hover { background:var(--primary); color:#fff; }
    .tot-when { text-align:center; margin:26px 0 10px; line-height:1.15; }
    .tot-alert { background:#c8102e; color:#fff; font-weight:800; font-size:clamp(17px, 2vw, 22px); line-height:1.35; text-align:center; border-radius:12px; padding:14px 18px; margin:0 0 4px; }
    .section:has(.tot-alert) { padding-top:18px; }
    .tot-notice { background:#1a1a1a; color:#fff; border-radius:12px; padding:16px 18px; margin:4px 0 18px; text-align:center; }
    .tot-notice-big { font-size:clamp(20px, 2.6vw, 30px); font-weight:800; line-height:1.25; margin:0; color:#ffb347; }
    .tot-notice-small { font-size:clamp(15px, 1.7vw, 18px); font-weight:700; margin:8px 0 0; }
    .tot-date { font-size:clamp(30px, 4.6vw, 52px); font-weight:800; color:var(--primary-dark); margin:0; }
    .tot-time { font-size:clamp(26px, 4vw, 44px); font-weight:800; color:#d4570b; margin:6px 0 0; }
    .tot-where { font-size:clamp(17px, 2vw, 22px); font-weight:700; color:var(--text); margin:10px 0 0; }
    @media (max-width: 700px) { .tot-flyers { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/css/menus.css?v=6">
</head>
<body>

  <div id="preview-banner" class="pg-preview-banner" hidden>
    👁 PREVIEW — this is a draft. It is not visible to the public until you press Publish.
  </div>

  <div id="sc-header"></div>

  <div class="homepage-layout">
    <div id="sc-sidenav"></div>
    <div class="homepage-main">

      <section class="page-hero" style="background:linear-gradient(135deg,#045c28 0%,#087d40 100%)">
        <div class="container">
          <h1 id="hero-title">Loading…</h1>
          <p id="hero-sub" hidden></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="pg-body" id="pg-body"><p style="color:var(--text-light)">Loading…</p></div>
        </div>
      </section>

    </div>
  </div>

  <div id="sc-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/site-chrome.js?v=14"></script>
  <script src="/admin/render-blocks.js?v=2"></script>
  <script src="/js/signup-embed.js?v=5"></script>
  <script src="/js/photo-lightbox.js?v=2"></script>
  <script>
    renderSiteChrome();

    const PREFIX_TO_SCHOOL = { woestina:'woestina', jefferson:'jefferson', ms:'middle', hs:'high', pto:'pto' };
    const SCHOOL_LABEL = { woestina:'Woestina Pre-K', jefferson:'Jefferson Elementary',
      middle:'Middle School', high:'High School', pto:'Schalmont PTO' };
    const OWNER_EMAIL = 'julie@schalmontpto.com';
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(location.search);
    const isPreview = params.get('preview') === '1';
    const pageIdParam = params.get('id');
    let slug = params.get('slug');
    let prefix = params.get('prefix');
    if (!slug) {
      const m = location.pathname.match(/^\/(woestina|jefferson|ms|hs|pto)\/([A-Za-z0-9_-]+)/)
             || location.pathname.match(/^\/p\/([A-Za-z0-9_-]+)/)
             // A page with no school at all publishes prefix-less, schalmontpto.com/<slug> --
             // .htaccess only ever routes a bare single segment here when it isn't a real
             // static page, so this is safe to match unconditionally.
             || location.pathname.match(/^\/([A-Za-z0-9_-]+)\/?$/);
      if (m) { if (m.length === 3) { prefix = m[1]; slug = m[2]; } else { slug = m[1]; } }
    }
    const wantSchool = prefix ? PREFIX_TO_SCHOOL[prefix] : null;

    const body = document.getElementById('pg-body');
    const hero = document.getElementById('hero-title');

    const stuckTimer = setTimeout(() => {
      if (/Loading/.test(body.textContent)) {
        hero.textContent = 'Preview';
        body.innerHTML = '<p>This is taking longer than expected. Try refreshing, or make sure ' +
          'you are signed in to the back office in this browser.</p>';
      }
    }, 12000);
    const clearStuck = () => clearTimeout(stuckTimer);

    try {
      if (isPreview) {
        firebase.auth().onAuthStateChanged(async (user) => {
          clearStuck();
          if (!user) { fail('Please <a href="/login.html">sign in</a> as a PTO administrator, then reopen the preview.'); return; }
          if (!await canPreview(user)) { fail('Your account can\'t preview this page.'); return; }
          render(true);
        });
      } else { clearStuck(); render(false); }
    } catch (e) { clearStuck(); fail('Could not start: ' + escapeHtml(e.message)); }

    function fail(msgHtml) { hero.textContent = 'Preview'; body.innerHTML = '<p>' + msgHtml + '</p>'; }

    async function canPreview(user) {
      if (user.email === OWNER_EMAIL) return true;
      try {
        const d = (await db.collection('users').doc(user.uid).get()).data() || {};
        if (d.role === 'superadmin') return true;
        if (d.role === 'admin' && Array.isArray(d.adminSchools) && wantSchool)
          return d.adminSchools.includes(wantSchool);
      } catch (_) {}
      return false;
    }

    function routeOf(d) {
      const list = Array.isArray(d.schools) && d.schools.length ? d.schools
                 : (d.school ? [d.school] : []);
      if (list.length === 1) return list[0];
      return list.length === 0 ? '' : 'pto';
    }
    function pageHref(d) {
      const school = routeOf(d);
      const prefix = { woestina:'woestina', jefferson:'jefferson', middle:'ms', high:'hs', pto:'pto' }[school];
      return prefix ? '/' + prefix + '/' + d.slug : '/' + d.slug;
    }

    /* Pages combined in the site code (until it's done in the back office): the volunteer
       page's sign-up sheets are shown inside the main event page, and the old volunteer link
       forwards there (also redirected in .htaccess). */
    // (Function declarations, not consts: render() runs before this part of the script is reached.)
    function mergeCfg() { return {
      // 2026 Schalmont PTO Trail of Treats  <-  Trail of Treats Volunteer Crew
      '7Pgsdbof9URojBmTyi3J': { from: 'jykqeTbLZAowLXPJ9hr9', link: 'trail-of-treats-volunteers', skip: 2,
        anchor: 'volunteer', heading: 'Volunteer Sign-Ups', fixHref: '/signup/trailrsvp',
        calloutAfter: 'Friday, October 30', callout: 'We still need volunteers for Friday! Sign up below →',
        layout: 'trailoftreats', noBirthdate: true,   // Julie: no birthday check on this page
        notice: '<p class="tot-notice-big">All volunteers: please arrive at 5:30 PM and check in at the PTO table.</p>' +
                '<p class="tot-notice-small">Trail Set Up Team: 2:00 PM, meet at the back of the Middle School.</p>',
        // Corrections to the embedded sign-up sheets (Julie, Oct 2026)
        // Every slot is on the event day (they were saved as Sept 30, the day the sheets were made).
        sheets: {
          'tvR23zACcMZbh86Sr6KZ': { slot: { date: '2026-10-30' } },   // RSVP
          'lw0RNHociidFEg6soK02': { slot: { date: '2026-10-30' } },   // Sabre Scarers
          'C6rCRrRmFcJN39t5Ku0g': { sheet: { eventTime: '14:00', eventEndTime: '', eventLocation: 'Back of the Middle School' }, slot: { date: '2026-10-30', start: '14:00', end: '' } },   // Trail Set Up Team
          '1vk052Klw3hVOcBA48aH': { slot: { date: '2026-10-30' } },   // Trail Tear-Down Team
          '6VUGyf47KVN8JxvPlntx': { slot: { date: '2026-10-30' } },   // Trail Chaperones
          'rcmnyKQZnkce7yhw4g7K': { slot: { date: '2026-10-30' } },   // Trail Entrance Guards
          'MQKGtw6LYwh41EyP7PAM': { slot: { date: '2026-10-30' } },   // Bake Sale Table Help
          '5PTxnanbUUPColwTYrON': { slot: { date: '2026-10-30' }, note: 'Drop off anytime before 3:00 PM on Friday, October 30.' }   // Bake Sale Donations
        } }
    }; }
    function sendTo() { return { 'trail-of-treats-volunteers': '/trailoftreats#volunteer' }; }

    // Emoji-free text, for pages that ask for it (Julie: Trail of Treats).
    const EMOJI = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2300}-\u{23FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]\s?/gu;
    function noEmoji(x) {
      if (typeof x === 'string') return x.replace(EMOJI, '');
      if (Array.isArray(x)) return x.map(noEmoji);
      if (x && typeof x === 'object') { const o = {}; Object.keys(x).forEach(k => { o[k] = noEmoji(x[k]); }); return o; }
      return x;
    }
    /* Trail of Treats layout (Julie, Oct 2026): "not a drop-off event" first, then the three flyers
       side by side (click = lightbox, link under each to download), the sign-up buttons, a big
       date line, then the page's own content minus the old flyer row, date line and candy flyer. */
    function trailLayout(blocks) {
      const flyers = [
        ['/uploads/pages/pto/20261002-100009-9131affe06.png', 'Haunted Trail of Treats flyer', 'Trail-of-Treats-Flyer.png'],
        ['/images/flyers/trail-of-treats-danger.jpg', 'Trail of Treats needs you: danger of canceling this event', 'Trail-of-Treats-Needs-You.jpg'],
        ['/uploads/pages/pto/20261007-115513-82ee696148.jpg', 'Feed the Candy Monster: candy donations flyer', 'Feed-the-Candy-Monster.jpg']
      ];
      const row = '<div class="tot-flyers">' + flyers.map(f =>
        '<figure><img src="' + f[0] + '" alt="' + f[1] + '" loading="lazy"><figcaption><a href="' + f[0] + '" download="' + f[2] + '">Download flyer</a></figcaption></figure>').join('') + '</div>';
      const isDrop = b => /not a drop-off event/i.test(b.text || '');
      const isFlyerRow = b => b.type === 'columns' && JSON.stringify(b).indexOf('DOWNLOAD FLYER') >= 0;
      const isDate = b => b.type === 'heading' && /Friday, October 30/.test(b.text || '');
      const isCandyFlyer = b => b.type === 'image' && /82ee696148/.test(b.url || '');
      const drop = blocks.filter(isDrop), rest = [];
      let buttons = null, volIntro = '';
      const ZONES_OLD = /five themed trail zones\s*[—-]\s*Bloody Camp, Medical, Spiders, Witches, and Zombies\s*[—-]/i;
      blocks.forEach((b, i) => {
        if (isDrop(b) || isFlyerRow(b) || isDate(b) || isCandyFlyer(b)) return;
        if (i === 0 && b.type === 'columns') {   // RSVP / Scare Crew buttons: Scare Crew jumps to the sign-ups below
          buttons = JSON.parse(JSON.stringify(b).replace(/https?:\/\/schalmontpto\.com\/trail-of-treats-volunteers|\/trail-of-treats-volunteers/g, '/trailoftreats#volunteer'));
          return;
        }
        if (b.type === 'image' && !b.url) return;                       // an empty picture slot
        if (b.type === 'heading' && /^volunteers needed/i.test(String(b.text || '').trim())) return;   // moved into the sign-up box
        if (b.type === 'paragraph' && /It takes a whole crew/i.test(b.text || '')) { volIntro = b.text; return; }
        if (ZONES_OLD.test(b.text || '')) b = Object.assign({}, b, { text: b.text.replace(ZONES_OLD, 'four themed trail zones — Bloody Camp/Medical, Circus/Clowns/Carnival, Witches &amp; Spiders, and Zombies &amp; Aliens —') });
        if (/Prefer to donate monetarily/i.test(b.text || '')) {
          rest.push({ type: 'paragraph', align: 'center', rich: true, text: 'Can\'t send in candy but want to help? Donate so we can buy candy for the event: <a href="https://www.zeffy.com/en-US/donation-form/schalmont-trail-of-treats-monetary-candy-donation">donate online here</a>, or send cash or a check (made payable to <b>Schalmont PTO</b>) in with your student, in an envelope labeled <b>Schalmont PTO</b>.' });
          return;
        }
        if (b.type === 'button' && /candy fund/i.test(b.label || '')) {
          rest.push(Object.assign({}, b, { label: 'DONATE ONLINE FOR CANDY', href: 'https://www.zeffy.com/en-US/donation-form/schalmont-trail-of-treats-monetary-candy-donation' }));
          return;
        }
        rest.push(b);
      });
      const date = '<div class="tot-when"><p class="tot-date">Friday, October 30, 2026</p><p class="tot-time">6:00 – 8:00 PM</p><p class="tot-where">Schalmont Middle School Back Fields</p></div>';
      const alertBox = drop.map(b => '<div class="tot-alert">' + String(b.text || '').replace(/<[^>]+>/g, '') + '</div>').join('');
      return { top: alertBox + row + (buttons ? renderBlocks([buttons]) : '') + date, blocks: rest, volIntro: volIntro };
    }

    async function mergedBody(p, pId) {
      const m = mergeCfg()[pId];
      if (!m) return renderBlocks(p.blocks);
      let extra = [];
      try {
        const d = await db.collection('pages').doc(m.from).get();
        if (d.exists && d.data().status === 'published') extra = (d.data().blocks || []).slice(m.skip || 0);
      } catch (_) {}
      if (!extra.length) return renderBlocks(p.blocks);
      let blocks = JSON.parse(JSON.stringify(p.blocks || []));
      let lead = '', volIntro = '';
      if (m.layout === 'trailoftreats') {
        blocks = noEmoji(blocks); extra = noEmoji(extra);
        const L = trailLayout(blocks); lead = L.top; blocks = L.blocks; volIntro = L.volIntro;
      }
      const isLink = b => b && b.type === 'button' && String(b.href || '').indexOf(m.link) >= 0;
      const at = blocks.findIndex(isLink);
      blocks.forEach((b, i) => { if (i !== at && isLink(b)) b.href = /rsvp/i.test(b.label || '') ? m.fixHref : '/trailoftreats#' + m.anchor; });   // "RSVP" buttons -> the RSVP form
      // Buttons inside column blocks (e.g. the top "Scare Crew Signup") jump down to the sign-ups.
      (function walk(list) { (list || []).forEach(b => { if (b && b.cells) b.cells.forEach(c => walk(c.blocks)); else if (isLink(b)) b.href = /rsvp/i.test(b.label || '') ? m.fixHref : '/trailoftreats#' + m.anchor; }); })(blocks);
      const section = '<section id="' + m.anchor + '" style="scroll-margin-top:100px;margin:28px 0;padding:22px 18px;border:3px solid #f57914;border-radius:16px;background:#fff8f0">' +
        '<h2 style="text-align:center;margin:0 0 12px">' + m.heading + '</h2>' +
        (m.notice ? '<div class="tot-notice">' + m.notice + '</div>' : '') +
        (volIntro ? renderBlocks([{ type: 'paragraph', align: 'center', text: volIntro }]) : '') + renderBlocks(extra) + '</section>';
      const before = at >= 0 ? blocks.slice(0, at) : blocks, after = at >= 0 ? blocks.slice(at + 1) : [];
      let ci = before.findIndex(b => String(b.text || '').indexOf(m.calloutAfter) >= 0);
      if (ci < 0 && lead) ci = -2;   // custom layout: callout goes first, right under the date
      const callout = '<p style="text-align:center;margin:18px 0"><a href="#' + m.anchor + '" style="display:inline-block;background:#f57914;color:#fff;font-weight:800;font-size:18px;padding:14px 24px;border-radius:999px;text-decoration:none">' + m.callout + '</a></p>';
      const top = ci >= 0 ? renderBlocks(before.slice(0, ci + 1)) + callout + renderBlocks(before.slice(ci + 1)) : callout + renderBlocks(before);   // ci -2/-1: callout first
      return lead + top + section + renderBlocks(after);
    }

    async function render(preview) {
      try {
        if (!preview && !pageIdParam && sendTo()[slug]) { location.replace(sendTo()[slug]); return; }
        let p = null, pId = null;
        if (pageIdParam) {
          const doc = await db.collection('pages').doc(pageIdParam).get();
          if (doc.exists && (preview || doc.data().status === 'published')) { p = doc.data(); pId = doc.id; }
        } else {
          if (!slug) { notFound(); return; }
          // Firestore denies an entire query (not just the non-matching docs) if any
          // document it could return would fail the security rule for this reader --
          // so an anonymous visitor's query must filter on status itself, matching
          // the rule, or a draft sharing the same slug makes the whole lookup fail.
          let query = db.collection('pages').where('slug', '==', slug);
          if (!preview) query = query.where('status', '==', 'published');
          const snap = await query.get();
          const hit = snap.docs.find(d => (preview || d.data().status === 'published') && (!wantSchool || routeOf(d.data()) === wantSchool));
          if (hit) { p = hit.data(); pId = hit.id; }
          if (!p) {
            // No page has this as its current slug -- maybe it used to, before the page's
            // own link changed, or it's an alias the admin added on purpose. Redirects live
            // in their own page_redirects/<slug> doc (see admin/page-editor.html's
            // syncRedirects()), so this is a plain doc-id lookup -- no query, no index,
            // and no security-rule gymnastics over which drafts a query could touch.
            const rdoc = await db.collection('page_redirects').doc(slug).get();
            if (rdoc.exists) {
              const targetSnap = await db.collection('pages').doc(rdoc.data().pageId).get();
              if (targetSnap.exists && (preview || targetSnap.data().status === 'published')) {
                location.replace(pageHref(targetSnap.data()));
                return;
              }
            }
          }
        }
        // Pages taken off the public site even though still published in the back office.
        if (!preview && p && /^trunk or treat 2026$/i.test(String(p.title || '').trim())) p = null;
        if (!p) { notFound(); return; }

        document.title = p.title + ' — Schalmont PTO';
        hero.textContent = p.title || 'Untitled page';
        if (preview && p.status !== 'published') document.getElementById('preview-banner').hidden = false;
        if ((mergeCfg()[pId] || {}).noBirthdate) window.SIGNUP_NO_DOB = true;   // no date-of-birth step on this page's sheets
        if ((mergeCfg()[pId] || {}).sheets) window.SIGNUP_OVERRIDES = mergeCfg()[pId].sheets;
        body.innerHTML = renderPageHeader(p) + await mergedBody(p, pId);
        mountSignupEmbeds(db);
        // Emoji-free pages: the sign-up sheets draw themselves in afterwards, so clean their text as it arrives.
        if ((mergeCfg()[pId] || {}).layout) {
          const clean = () => {
            const w = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
            for (let n; (n = w.nextNode());) {
              const t = n.nodeValue.replace(EMOJI, '')
                // Sabre Scarer zones as the sign-up slots have them (Julie)
                .replace(/Bloody Camp, Medical, Spiders, Witches, or Zombies/g, 'Bloody Camp/Medical, Circus/Clowns/Carnival, Witches & Spiders, or Zombies & Aliens')
                .replace(/\*\*/g, '');   // the sheets' **bold** markers aren't turned into bold, so drop them
              if (t !== n.nodeValue) n.nodeValue = t;
            }
          };
          clean();
          new MutationObserver(clean).observe(body, { childList: true, subtree: true });
        }
        if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView({ block: 'start' }), 300); }
        renderPageRelations(p, pId);
      } catch (e) {
        hero.textContent = 'Sorry';
        body.innerHTML = isPreview
          ? '<p>Could not load this page: ' + escapeHtml(e.message || String(e)) + '</p>'
          : '<p>This page could not be loaded right now.</p>';
      }
    }

    // A parent link at the top and a sub-pages list at the bottom, when this page
    // has either. Best-effort/non-fatal -- a missing or still-draft parent, or a
    // failed lookup, just means that piece doesn't show, never breaks the page itself.
    async function renderPageRelations(p, pId) {
      if (p.parentPageId) {
        try {
          const parentSnap = await db.collection('pages').doc(p.parentPageId).get();
          if (parentSnap.exists && parentSnap.data().status === 'published') {
            const parent = parentSnap.data();
            body.insertAdjacentHTML('afterbegin',
              '<p style="margin:0 0 16px"><a href="' + escapeHtml(pageHref(parent)) +
              '" style="color:var(--primary);font-weight:700;text-decoration:none">&larr; Part of: ' +
              escapeHtml(parent.title) + '</a></p>');
          }
        } catch (_) {}
      }
      if (!pId) return;
      try {
        const kidsSnap = await db.collection('pages')
          .where('parentPageId', '==', pId).where('status', '==', 'published').get();
        if (!kidsSnap.size) return;
        const merged = Object.values(mergeCfg()).map(m => m.from);   // already shown on this page
        const kidsDocs = kidsSnap.docs.filter(d => merged.indexOf(d.id) < 0);
        if (!kidsDocs.length) return;
        const items = kidsDocs.map(d => {
          const k = d.data();
          return '<li><a href="' + escapeHtml(pageHref(k)) + '" style="color:var(--primary);font-weight:600">' +
            escapeHtml(k.title) + '</a></li>';
        }).join('');
        body.insertAdjacentHTML('beforeend',
          '<div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border)">' +
          '<h3 style="margin:0 0 10px">Related pages</h3><ul style="margin:0;padding-left:20px">' + items + '</ul></div>');
      } catch (_) {}
    }

    function notFound() {
      hero.textContent = 'Page not found';
      body.innerHTML = '<p>This page may have been unpublished, or the link is mistyped. ' +
        '<a href="/index.html">Go to the Schalmont PTO home page</a>.</p>';
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  </script>
  <script src="/js/menus.js?v=3"></script>
</body>
</html>
