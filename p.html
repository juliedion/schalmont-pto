<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schalmont PTO</title>
  <link rel="stylesheet" href="css/styles.css?v=6">
  <link rel="stylesheet" href="admin/admin.css">
  <link rel="icon" href="images/favicon.svg">
  <style>
    body { background: var(--light-bg); margin: 0; }
    .pg-header { background: var(--primary-dark); padding: 14px 20px; }
    .pg-header a { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 800; }
    .pg-header img { height: 34px; background:#fff; border-radius:6px; padding:3px; }
    .pg-wrap { max-width: 760px; margin: 0 auto; padding: 34px 20px 80px; }
    .pg-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: clamp(20px, 5vw, 44px); }
    .pg-foot { text-align: center; font-size: 13px; color: var(--text-light); margin-top: 26px; }
    .pg-foot a { color: var(--primary); }
  </style>
</head>
<body>
  <div id="preview-banner" class="pg-preview-banner" hidden>
    👁 PREVIEW — this is a draft. It is not visible to the public until you press Publish.
  </div>
  <div class="pg-header">
    <a href="index.html"><img src="images/logo.png" alt=""> Schalmont Central PTO</a>
  </div>
  <div class="pg-wrap">
    <div class="pg-card">
      <div class="pg-body" id="pg-body">
        <p style="color:var(--text-light)">Loading…</p>
      </div>
    </div>
    <div class="pg-foot" id="pg-foot"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="admin/render-blocks.js"></script>
  <script>
    const SCHOOL_LABEL = { woestina:'Woestina Pre-K', jefferson:'Jefferson Elementary',
      middle:'Middle School', high:'High School', pto:'Schalmont PTO' };
    const PREFIX_TO_SCHOOL = { woestina:'woestina', jes:'jefferson', ms:'middle', hs:'high', pto:'pto' };
    const OWNER_EMAIL = 'julie@schalmontpto.com';
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(location.search);
    const isPreview = params.get('preview') === '1';
    let slug = params.get('slug');
    let prefix = params.get('prefix');
    if (!slug) {
      const m = location.pathname.match(/^\/(woestina|jes|ms|hs|pto)\/([A-Za-z0-9_-]+)/)
             || location.pathname.match(/^\/p\/([A-Za-z0-9_-]+)/);
      if (m) { if (m.length === 3) { prefix = m[1]; slug = m[2]; } else { slug = m[1]; } }
    }
    const wantSchool = prefix ? PREFIX_TO_SCHOOL[prefix] : null;

    const body = document.getElementById('pg-body');

    if (isPreview) {
      firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) { body.innerHTML = '<h1>Preview</h1><p>Please <a href="login.html">sign in</a> as a PTO administrator to preview this page.</p>'; return; }
        const ok = await canPreview(user);
        if (!ok) { body.innerHTML = '<h1>Preview</h1><p>Your account can\'t preview this page.</p>'; return; }
        render(true);
      });
    } else {
      render(false);
    }

    async function canPreview(user) {
      if (user.email === OWNER_EMAIL) return true;
      try {
        const d = (await db.collection('users').doc(user.uid).get()).data() || {};
        if (d.role === 'superadmin') return true;
        if (d.role === 'admin' && Array.isArray(d.adminSchools) && wantSchool)
          return d.adminSchools.includes(wantSchool);
      } catch (_) {}
      return false;
    }

    async function render(preview) {
      if (!slug) { body.innerHTML = notFound(); return; }
      try {
        const snap = await db.collection('pages').where('slug', '==', slug).get();
        const match = snap.docs
          .map(d => d.data())
          .find(d => (preview || d.status === 'published') && (!wantSchool || d.school === wantSchool));
        if (!match) { body.innerHTML = notFound(); return; }
        const p = match;
        document.title = p.title + ' — Schalmont PTO';
        if (preview && p.status !== 'published') document.getElementById('preview-banner').hidden = false;
        body.innerHTML = `<h1>${escapeHtml(p.title)}</h1>` + renderPageHeader(p) + renderBlocks(p.blocks);
        document.getElementById('pg-foot').innerHTML =
          `${SCHOOL_LABEL[p.school] || 'Schalmont PTO'} &nbsp;·&nbsp; <a href="index.html">Schalmont PTO home</a>`;
      } catch (e) {
        body.innerHTML = '<p>Sorry, this page could not be loaded right now.</p>';
      }
    }

    function notFound() {
      return '<h1>Page not found</h1><p>This page may have been unpublished or the link is ' +
        'mistyped. <a href="index.html">Go to the Schalmont PTO home page</a>.</p>';
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  </script>
</body>
</html>
