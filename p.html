<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Schalmont PTO">
  <meta property="og:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <title>Schalmont PTO</title>
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <link rel="stylesheet" href="/admin/admin.css?v=8">
  <link rel="icon" href="/images/favicon.svg">
  <style>
    .pg-preview-banner { background:#8a6d1a; color:#fff; text-align:center; font-weight:700;
      font-size:13px; padding:8px 14px; }
    .page-hero h1 { margin:0; }
    .page-hero p { margin:10px 0 0; }
    #pg-body { max-width:none; }
    .pg-fb-row { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:14px 0; }
    .pg-fb-btn { display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:16px; text-decoration:none; border-radius:999px; padding:12px 22px; background:#fff; color:var(--primary-dark) !important; border:2px solid var(--primary); }
    .pg-fb-btn:hover { background:#eef7e6; }
    .pg-fb-btn.is-main { background:#0bc151; border-color:#0bc151; color:#fff !important; }
    .pg-fb-btn.is-main:hover { filter:brightness(.95); }
    .pg-donate-money { display:flex; flex-wrap:wrap; align-items:center; gap:18px; background:#fff; border:2px solid #0bc151; border-radius:14px; padding:14px 18px; margin:0 0 16px; }
    .pg-donate-money img { width:150px; height:150px; flex:none; }
    .pg-donate-money > div { flex:1 1 260px; }
    .pg-donate-money p { margin:0 0 10px; }
    .pg-vol-hours { background:#eef7e6; border:1px solid #cfe6bf; border-radius:12px; padding:10px 14px; font-size:16px; }
    .pg-fb-img { display:block; width:100% !important; max-width:520px !important; height:auto !important; margin:0 auto !important; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.15); }
    /* ===== Brawl for the Ball page layout (Julie, Nov 2026): one clear path to tickets, raffle donations, volunteering ===== */
    .bb { --bb-ink:#0b3d24; --bb-green:#0f7a3c; --bb-go:#0bc151; --bb-soft:#f2fbeb; --bb-line:#d7ebcb; color:#1d2a22; }
    .bb section, .bb [id] { scroll-margin-top:100px; }
    .bb h2 { font-size:clamp(24px, 3vw, 32px); color:var(--bb-ink); margin:0 0 6px; line-height:1.15; }
    .bb .bb-lede { font-size:17px; line-height:1.6; margin:0 0 18px; color:#3a4a40; }
    .bb-sec { margin:44px 0 0; }
    .bb-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:17px; line-height:1.2; text-decoration:none !important; border-radius:999px; padding:14px 26px; border:2px solid transparent; cursor:pointer; transition:transform .12s, filter .12s; text-align:center; }
    .bb-btn:hover { transform:translateY(-1px); filter:brightness(.96); }
    .bb-btn-go { background:var(--bb-go); color:#fff !important; box-shadow:0 4px 14px rgba(11,193,81,.35); }
    .bb-btn-dark { background:var(--bb-ink); color:#fff !important; }
    .bb-btn-line { background:#fff; color:var(--bb-ink) !important; border-color:var(--bb-green); }
    .bb-btn-ghost { background:rgba(255,255,255,.1); color:#fff !important; border-color:rgba(255,255,255,.7); }
    .bb-btn-big { font-size:19px; padding:16px 32px; }
    /* Hero */
    .bb-hero { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:28px; align-items:center; background:radial-gradient(120% 140% at 0% 0%, #138a46 0%, #0b3d24 60%, #072a18 100%); color:#fff; border-radius:22px; padding:30px 32px; }
    .bb-eyebrow { text-transform:uppercase; letter-spacing:.12em; font-weight:800; font-size:13px; color:#9ff27a; margin:0 0 8px; }
    .bb-hero h1 { font-size:clamp(36px, 6vw, 60px); line-height:1; margin:0 0 10px; color:#fff; letter-spacing:-.01em; }
    .bb-vs { font-size:clamp(17px, 2vw, 21px); font-weight:700; margin:0 0 18px; color:#e6f5ea; }
    .bb-vs b { color:#fff; }
    .bb-facts { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px !important; padding:0 !important; list-style:none; }
    .bb-facts li { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:8px 14px; font-weight:800; font-size:15.5px; margin:0; }
    .bb-facts li::before, .bb-facts li::marker { content:none; display:none; }
    .bb-hero p.bb-blurb { font-size:16.5px; line-height:1.6; color:#e6f5ea; margin:0 0 20px; max-width:640px; }
    .bb-hero-ctas { display:flex; flex-wrap:wrap; gap:10px; }
    .bb-hero-flyer { display:block; text-align:center; color:#fff !important; text-decoration:none !important; font-weight:700; font-size:14px; }
    .bb-hero-flyer img { width:100%; height:auto; display:block; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.4); margin-bottom:8px; transform:rotate(1.5deg); transition:transform .15s; }
    .bb-hero-flyer:hover img { transform:rotate(0) scale(1.02); }
    /* Three ways */
    .bb-ways { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; margin:22px 0 0; }
    .bb-way { position:relative; display:flex; flex-direction:column; background:#fff; border:1px solid var(--bb-line); border-radius:18px; padding:22px 20px 20px; box-shadow:0 2px 10px rgba(11,61,36,.06); }
    .bb-way.is-main { border:2px solid var(--bb-go); }
    .bb-way-n { width:34px; height:34px; border-radius:50%; background:var(--bb-ink); color:#fff; display:grid; place-items:center; font-weight:800; margin-bottom:12px; }
    .bb-way.is-main .bb-way-n { background:var(--bb-go); }
    .bb-way h3 { margin:0 0 6px; font-size:21px; color:var(--bb-ink); }
    .bb-way p { margin:0 0 16px; font-size:15.5px; line-height:1.55; color:#3a4a40; flex:1; }
    .bb-way .bb-btn { width:100%; box-sizing:border-box; }
    /* Tickets */
    .bb-tix { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:22px; align-items:start; background:#fff; border:2px solid var(--bb-go); border-radius:20px; padding:24px; }
    .bb-prices { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:6px 0 16px; }
    .bb-price { background:var(--bb-soft); border-radius:14px; padding:14px 10px; text-align:center; }
    .bb-price b { display:block; font-size:30px; color:var(--bb-ink); line-height:1; }
    .bb-price span { display:block; font-size:14px; font-weight:700; color:#3a4a40; margin-top:6px; line-height:1.3; }
    .bb-price.is-deal { background:var(--bb-ink); }
    .bb-price.is-deal b, .bb-price.is-deal span { color:#fff; }
    .bb-note { font-size:15px; margin:0 0 16px; line-height:1.55; }
    .bb-note strong { color:#b3261e; }
    .bb-qr { text-align:center; background:var(--bb-soft); border-radius:16px; padding:16px; }
    .bb-qr img { width:150px; height:150px; display:block; margin:0 auto 8px; background:#fff; border-radius:8px; padding:6px; }
    .bb-qr span { font-weight:800; font-size:14px; color:var(--bb-ink); }
    /* What's happening */
    .bb-fun { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin:16px 0 0 !important; padding:0 !important; list-style:none; }
    .bb-fun li { background:#fff; border:1px solid var(--bb-line); border-radius:14px; padding:14px 16px; margin:0; font-size:15px; line-height:1.45; color:#3a4a40; }
    .bb-fun li::before, .bb-fun li::marker { content:none; display:none; }
    .bb-fun li b { display:block; font-size:16.5px; color:var(--bb-ink); margin-bottom:2px; }
    .bb-fun .bb-ico { font-size:24px; display:block; margin-bottom:6px; }
    /* Raffle + volunteer panels */
    .bb-panel { background:var(--bb-soft); border:2px solid #9fdc7e; border-radius:20px; padding:26px 24px; }
    .bb-give { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; margin:0 0 20px; }
    .bb-give > div { background:#fff; border:1px solid var(--bb-line); border-radius:16px; padding:18px; display:flex; flex-direction:column; }
    .bb-give h3 { margin:0 0 6px; font-size:19px; color:var(--bb-ink); }
    .bb-give p { margin:0 0 14px; font-size:15.5px; line-height:1.55; flex:1; }
    .bb-give-money { display:flex; gap:14px; align-items:center; }
    .bb-give-money img { width:96px; height:96px; flex:none; }
    .bb-sheet-h { font-size:18px; font-weight:800; color:var(--bb-ink); margin:4px 0 10px; }
    .bb-filled { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid var(--bb-line); border-left:6px solid var(--bb-go); border-radius:14px; padding:14px 18px; margin:0 0 16px; }
    .bb-filled b { display:block; font-size:16.5px; color:var(--bb-ink); }
    .bb-filled span { display:block; font-size:15px; color:#3a4a40; margin-top:2px; }
    .bb-filled em { font-style:normal; font-weight:800; font-size:14px; color:#fff; background:var(--bb-green); border-radius:999px; padding:6px 12px; white-space:nowrap; }
    .bb-hours { display:flex; gap:12px; align-items:center; background:#fff; border:2px dashed var(--bb-go); border-radius:14px; padding:12px 16px; margin:0 0 18px; font-size:16px; }
    .bb-hours span { font-size:26px; }
    /* Know before you go */
    .bb-info { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin:16px 0 0; }
    .bb-info > div { background:#fff; border:1px solid var(--bb-line); border-radius:16px; padding:18px; }
    .bb-info h3 { margin:0 0 8px; font-size:18px; color:var(--bb-ink); }
    .bb-info p { margin:0 0 8px; font-size:15px; line-height:1.55; }
    .bb-info a:not(.bb-btn) { color:var(--bb-green); font-weight:700; word-break:break-word; }
    .bb-contacts { list-style:none; margin:0 !important; padding:0 !important; }
    .bb-contacts li { margin:0 0 8px; font-size:15px; line-height:1.4; }
    .bb-contacts li::before, .bb-contacts li::marker { content:none; display:none; }
    .bb-contacts small { display:block; color:#5f6f65; }
    .bb-flyer-thumb { display:block; max-width:170px; margin:0 0 10px; }
    .bb-flyer-thumb img { width:100%; height:auto; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,.18); }
    /* Phones: actions pinned to the bottom of the screen */
    .bb-bar { display:none; }
    @media (max-width: 900px) {
      .bb-hero { grid-template-columns:1fr; padding:24px 20px; }
      .bb-hero-flyer { display:none; }
      .bb-ways, .bb-fun, .bb-info { grid-template-columns:1fr; }
      .bb-tix { grid-template-columns:1fr; padding:18px; }
      .bb-prices { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .bb-give { grid-template-columns:1fr; }
      .bb-panel { padding:20px 16px; }
    }
    @media (max-width: 760px) {
      .bb-bar { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:6px; position:fixed; left:0; right:0; bottom:0; z-index:50; background:#fff; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -4px 18px rgba(0,0,0,.15); }
      .bb-bar a { font-size:14.5px; padding:12px 6px; }
      body:has(.bb-bar) { padding-bottom:78px; }
      .bb-hero-ctas .bb-btn { flex:1 1 100%; }
    }
    .pg-vol { background:#f2fbeb; border:2px solid #63E629; border-radius:18px; padding:22px 24px; margin:28px 0 8px; scroll-margin-top:100px; }
    .pg-vol h2 { margin:0 0 6px; font-size:clamp(22px, 2.6vw, 28px); color:var(--primary-dark); }
    .pg-vol > p { margin:0 0 14px; font-size:16px; line-height:1.6; }
    .pg-vol-roles { list-style:none; margin:0 0 18px !important; padding:0 !important; display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; }
    .pg-vol-roles li { background:#fff; border:1px solid #d7ebcb; border-radius:12px; padding:10px 14px; font-weight:800; color:var(--primary-dark); font-size:15.5px; }
    .pg-vol-roles li { list-style:none; margin:0; }
    .pg-vol-roles li::before, .pg-vol-roles li::marker { content:none; display:none; }
    .pg-vol-roles li small { display:block; font-weight:500; color:var(--text-light); font-size:13.5px; margin-top:2px; }
    .pg-vol-btn { display:inline-block; background:var(--primary); color:#fff !important; font-weight:800; border-radius:999px; padding:12px 24px; text-decoration:none; }
    .pg-topbox { background:#fff8ec; border:2px solid #e6a23c; border-radius:16px; padding:18px 22px; margin:0 0 24px; text-align:center; }
    .pg-topbox p { margin:0 0 8px; font-size:16px; }
    .pg-topbox-t { font-size:clamp(20px, 2.4vw, 26px) !important; font-weight:800; color:var(--primary-dark); }
    .pg-topbox-code { font-size:clamp(34px, 5vw, 52px) !important; font-weight:800; letter-spacing:.08em; color:#b3261e; line-height:1.1; }
    .pg-topbox-btn { display:inline-block; background:var(--primary); color:#fff !important; font-weight:800; border-radius:999px; padding:12px 22px; text-decoration:none; margin-top:4px; }
    .pg-topbox a:not(.pg-topbox-btn) { color:var(--primary); font-weight:700; }
    .tot-flyers { display:grid; grid-template-columns:minmax(0, .7723fr) minmax(0, .6667fr); gap:18px; margin:18px 0 22px; align-items:start; }   /* widths ∝ each flyer's width/height, so both are the same height */
    .tot-flyers figure { margin:0; text-align:center; }
    .tot-flyers img { width:100%; height:auto; display:block; border-radius:12px; cursor:zoom-in; box-shadow:0 4px 16px rgba(0,0,0,.15); }
    .tot-flyers figcaption { margin-top:10px; }
    .tot-flyers figcaption a { display:inline-block; font-weight:800; color:var(--primary); text-decoration:none; border:2px solid var(--primary); border-radius:999px; padding:7px 16px; }
    .tot-flyers figcaption a:hover { background:var(--primary); color:#fff; }
    .tot-when { text-align:center; margin:26px 0 10px; line-height:1.15; }
    .tot-alert { background:#c8102e; color:#fff; font-weight:800; font-size:clamp(17px, 2vw, 22px); line-height:1.35; text-align:center; border-radius:12px; padding:14px 18px; margin:0 0 4px; }
    .section:has(.tot-alert) { padding-top:18px; }
    .tot-notice { background:#1a1a1a; color:#fff; border-radius:12px; padding:16px 18px; margin:4px 0 18px; text-align:center; }
    .tot-notice-big { font-size:clamp(20px, 2.6vw, 30px); font-weight:800; line-height:1.25; margin:0; color:#ffb347; }
    .tot-notice-small { font-size:clamp(15px, 1.7vw, 18px); font-weight:700; margin:8px 0 0; }
    .tot-date { font-size:clamp(30px, 4.6vw, 52px); font-weight:800; color:var(--primary-dark); margin:0; }
    .tot-time { font-size:clamp(26px, 4vw, 44px); font-weight:800; color:#d4570b; margin:6px 0 0; }
    .tot-where { font-size:clamp(17px, 2vw, 22px); font-weight:700; color:var(--text); margin:10px 0 0; }
    @media (max-width: 700px) { .tot-flyers { grid-template-columns:1fr; } }
  </style>

<body>

  <div id="preview-banner" class="pg-preview-banner" hidden>
    👁 PREVIEW — this is a draft. It is not visible to the public until you press Publish.
  </div>

  <div id="sc-header"></div>

  <div class="homepage-layout">
    <div id="sc-sidenav"></div>
    <div class="homepage-main">

      <section class="page-hero" style="background:linear-gradient(135deg,#045c28 0%,#087d40 100%)">
        <div class="container">
          <h1 id="hero-title">Loading…</h1>
          <p id="hero-sub" hidden></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="pg-body" id="pg-body"><p style="color:var(--text-light)">Loading…</p></div>
        </div>
      </section>

    </div>
  </div>

  <div id="sc-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/site-chrome.js?v=17"></script>
  <script src="/admin/render-blocks.js?v=2"></script>
  <script src="/js/signup-embed.js?v=7"></script>
  <script src="/js/photo-lightbox.js?v=2"></script>
  <script>
    renderSiteChrome();

    const PREFIX_TO_SCHOOL = { woestina:'woestina', jefferson:'jefferson', ms:'middle', hs:'high', pto:'pto' };
    const SCHOOL_LABEL = { woestina:'Woestina Pre-K', jefferson:'Jefferson Elementary',
      middle:'Middle School', high:'High School', pto:'Schalmont PTO' };
    const OWNER_EMAIL = 'julie@schalmontpto.com';
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(location.search);
    const isPreview = params.get('preview') === '1';
    const pageIdParam = params.get('id');
    let slug = params.get('slug');
    let prefix = params.get('prefix');
    if (!slug) {
      const m = location.pathname.match(/^\/(woestina|jefferson|ms|hs|pto)\/([A-Za-z0-9_-]+)/)
             || location.pathname.match(/^\/p\/([A-Za-z0-9_-]+)/)
             // A page with no school at all publishes prefix-less, schalmontpto.com/<slug> --
             // .htaccess only ever routes a bare single segment here when it isn't a real
             // static page, so this is safe to match unconditionally.
             || location.pathname.match(/^\/([A-Za-z0-9_-]+)\/?$/);
      if (m) { if (m.length === 3) { prefix = m[1]; slug = m[2]; } else { slug = m[1]; } }
    }
    const wantSchool = prefix ? PREFIX_TO_SCHOOL[prefix] : null;

    const body = document.getElementById('pg-body');
    const hero = document.getElementById('hero-title');

    const stuckTimer = setTimeout(() => {
      if (/Loading/.test(body.textContent)) {
        hero.textContent = 'Preview';
        body.innerHTML = '<p>This is taking longer than expected. Try refreshing, or make sure ' +
          'you are signed in to the back office in this browser.</p>';
      }
    }, 12000);
    const clearStuck = () => clearTimeout(stuckTimer);

    try {
      if (isPreview) {
        firebase.auth().onAuthStateChanged(async (user) => {
          clearStuck();
          if (!user) { fail('Please <a href="/login.html">sign in</a> as a PTO administrator, then reopen the preview.'); return; }
          if (!await canPreview(user)) { fail('Your account can\'t preview this page.'); return; }
          render(true);
        });
      } else { clearStuck(); render(false); }
    } catch (e) { clearStuck(); fail('Could not start: ' + escapeHtml(e.message)); }

    function fail(msgHtml) { hero.textContent = 'Preview'; body.innerHTML = '<p>' + msgHtml + '</p>'; }

    async function canPreview(user) {
      if (user.email === OWNER_EMAIL) return true;
      try {
        const d = (await db.collection('users').doc(user.uid).get()).data() || {};
        if (d.role === 'superadmin') return true;
        if (d.role === 'admin' && Array.isArray(d.adminSchools) && wantSchool)
          return d.adminSchools.includes(wantSchool);
      } catch (_) {}
      return false;
    }

    function routeOf(d) {
      const list = Array.isArray(d.schools) && d.schools.length ? d.schools
                 : (d.school ? [d.school] : []);
      if (list.length === 1) return list[0];
      return list.length === 0 ? '' : 'pto';
    }
    function pageHref(d) {
      const school = routeOf(d);
      const prefix = { woestina:'woestina', jefferson:'jefferson', middle:'ms', high:'hs', pto:'pto' }[school];
      return prefix ? '/' + prefix + '/' + d.slug : '/' + d.slug;
    }

    /* Pages combined in the site code (until it's done in the back office): the volunteer
       page's sign-up sheets are shown inside the main event page, and the old volunteer link
       forwards there (also redirected in .htaccess). */
    // (Function declarations, not consts: render() runs before this part of the script is reached.)
    function mergeCfg() { return {
      // 2026 Schalmont PTO Trail of Treats  <-  Trail of Treats Volunteer Crew
      '7Pgsdbof9URojBmTyi3J': { from: 'jykqeTbLZAowLXPJ9hr9', link: 'trail-of-treats-volunteers', skip: 2,
        anchor: 'volunteer', heading: 'Volunteer Sign-Ups', fixHref: '/signup/trailrsvp',
        calloutAfter: 'Friday, October 30', callout: 'We still need volunteers for Friday! Sign up below →',
        layout: 'trailoftreats', noBirthdate: true,   // Julie: no birthday check on this page
        notice: '<p class="tot-notice-big">All volunteers: please arrive at 5:30 PM and check in at the PTO table.</p>' +
                '<p class="tot-notice-small">Trail Set Up Team: 2:00 PM, meet at the back of the Middle School.</p>',
        // Corrections to the embedded sign-up sheets (Julie, Oct 2026)
        // Every slot is on the event day (they were saved as Sept 30, the day the sheets were made).
        sheets: {
          'tvR23zACcMZbh86Sr6KZ': { slot: { date: '2026-10-30' } },   // RSVP
          'lw0RNHociidFEg6soK02': { slot: { date: '2026-10-30' } },   // Sabre Scarers
          'C6rCRrRmFcJN39t5Ku0g': { sheet: { eventTime: '14:00', eventEndTime: '', eventLocation: 'Back of the Middle School' }, slot: { date: '2026-10-30', start: '14:00', end: '' } },   // Trail Set Up Team

    async function mergedBody(p, pId) {
      const m = mergeCfg()[pId];
      if (!m) return renderBlocks(p.blocks);
      let extra = [];
      try {
        const d = await db.collection('pages').doc(m.from).get();
        if (d.exists && d.data().status === 'published') extra = (d.data().blocks || []).slice(m.skip || 0);
      } catch (_) {}
      if (!extra.length) return renderBlocks(p.blocks);
      let blocks = JSON.parse(JSON.stringify(p.blocks || []));
      let lead = '', volIntro = '';
      if (m.layout === 'trailoftreats') {
        blocks = noEmoji(blocks); extra = noEmoji(extra);
        const L = trailLayout(blocks); lead = L.top; blocks = L.blocks; volIntro = L.volIntro;
      }
      const isLink = b => b && b.type === 'button' && String(b.href || '').indexOf(m.link) >= 0;
      const at = blocks.findIndex(isLink);
      blocks.forEach((b, i) => { if (i !== at && isLink(b)) b.href = /rsvp/i.test(b.label || '') ? m.fixHref : '/trailoftreats#' + m.anchor; });   // "RSVP" buttons -> the RSVP form
      // Buttons inside column blocks (e.g. the top "Scare Crew Signup") jump down to the sign-ups.
      (function walk(list) { (list || []).forEach(b => { if (b && b.cells) b.cells.forEach(c => walk(c.blocks)); else if (isLink(b)) b.href = /rsvp/i.test(b.label || '') ? m.fixHref : '/trailoftreats#' + m.anchor; }); })(blocks);
      const section = '<section id="' + m.anchor + '" style="scroll-margin-top:100px;margin:28px 0;padding:22px 18px;border:3px solid #f57914;border-radius:16px;background:#fff8f0">' +
        '<h2 style="text-align:center;margin:0 0 12px">' + m.heading + '</h2>' +
        (m.notice ? '<div class="tot-notice">' + m.notice + '</div>' : '') +
        (volIntro ? renderBlocks([{ type: 'paragraph', align: 'center', text: volIntro }]) : '') + renderBlocks(extra) + '</section>';
      const before = at >= 0 ? blocks.slice(0, at) : blocks, after = at >= 0 ? blocks.slice(at + 1) : [];
      let ci = before.findIndex(b => String(b.text || '').indexOf(m.calloutAfter) >= 0);
      if (ci < 0 && lead) ci = -2;   // custom layout: callout goes first, right under the date
      const callout = '<p style="text-align:center;margin:18px 0"><a href="#' + m.anchor + '" style="display:inline-block;background:#f57914;color:#fff;font-weight:800;font-size:18px;padding:14px 24px;border-radius:999px;text-decoration:none">' + m.callout + '</a></p>';
      const top = ci >= 0 ? renderBlocks(before.slice(0, ci + 1)) + callout + renderBlocks(before.slice(ci + 1)) : callout + renderBlocks(before);   // ci -2/-1: callout first
      return lead + top + section + renderBlocks(after);

    async function render(preview) {
      try {
        if (!preview && !pageIdParam && sendTo()[slug]) { location.replace(sendTo()[slug]); return; }
        let p = null, pId = null;
        if (pageIdParam) {
          const doc = await db.collection('pages').doc(pageIdParam).get();
          if (doc.exists && (preview || doc.data().status === 'published')) { p = doc.data(); pId = doc.id; }
        } else {
          if (!slug) { notFound(); return; }
          // Firestore denies an entire query (not just the non-matching docs) if any
          // document it could return would fail the security rule for this reader --
          // so an anonymous visitor's query must filter on status itself, matching
          // the rule, or a draft sharing the same slug makes the whole lookup fail.
          let query = db.collection('pages').where('slug', '==', slug);
          if (!preview) query = query.where('status', '==', 'published');
          const snap = await query.get();
          const hit = snap.docs.find(d => (preview || d.data().status === 'published') && (!wantSchool || routeOf(d.data()) === wantSchool));
          if (hit) { p = hit.data(); pId = hit.id; }
          if (!p) {
            // No page has this as its current slug -- maybe it used to, before the page's
            // own link changed, or it's an alias the admin added on purpose. Redirects live
            // in their own page_redirects/<slug> doc (see admin/page-editor.html's
            // syncRedirects()), so this is a plain doc-id lookup -- no query, no index,
            // and no security-rule gymnastics over which drafts a query could touch.
            const rdoc = await db.collection('page_redirects').doc(slug).get();
            if (rdoc.exists) {
              const targetSnap = await db.collection('pages').doc(rdoc.data().pageId).get();
              if (targetSnap.exists && (preview || targetSnap.data().status === 'published')) {
                location.replace(pageHref(targetSnap.data()));
                return;
              }
            }
          }
        }
        // Pages taken off the public site even though still published in the back office.
        if (!preview && p && /^trunk or treat 2026$/i.test(String(p.title || '').trim())) p = null;
        if (!p) { notFound(); return; }
        // Site-kept fixes to a page's own fields (until they're made in the back office).
        const pf = pageFix()[pId];
        if (pf) {
          const sw = pf.swap || {};
          const blocks = (p.blocks || [])
            .filter(b => !(b.type === 'image' && !b.url))   // drop empty "flyer goes here" photo blocks
            .map(b => (sw[b.url] || sw[b.href]) ? Object.assign({}, b, sw[b.url] ? { url: sw[b.url] } : {}, sw[b.href] ? { href: sw[b.href] } : {}) : b);
          const fields = Object.assign({}, pf); delete fields.swap; delete fields.flyerButtons; delete fields.layout;
          p = Object.assign({}, p, fields, { blocks });
        }

        document.title = p.title + ' — Schalmont PTO';
        hero.textContent = p.title || 'Untitled page';
        if (preview && p.status !== 'published') document.getElementById('preview-banner').hidden = false;
        if ((mergeCfg()[pId] || {}).noBirthdate) window.SIGNUP_NO_DOB = true;   // no date-of-birth step on this page's sheets
        if ((mergeCfg()[pId] || {}).sheets) window.SIGNUP_OVERRIDES = mergeCfg()[pId].sheets;
        if ((pageFix()[pId] || {}).layout === 'brawl') {
          body.innerHTML = brawlLayout();
          const band = hero.closest('section'); if (band) band.hidden = true;   // the layout has its own hero
        } else body.innerHTML = (pageTop()[pId] || '') + renderPageHeader(p) + await mergedBody(p, pId) + (pageBottom()[pId] || '');
        mountSignupEmbeds(db);
        // Button rows above and below a page's flyer (pageFix flyerButtons).
        const fb = (pageFix()[pId] || {}).flyerButtons;
        if (fb) {
          const img = body.querySelector('img[src="' + fb.img + '"]');
          let blk = img;
          while (blk && blk.parentElement && blk.parentElement !== body) blk = blk.parentElement;
          if (blk && blk.parentElement === body) {
            const row = () => { const d = document.createElement('div'); d.className = 'pg-fb-row'; d.innerHTML = fb.html; return d; };
            // Keep the flyer a comfortable size instead of the full page width (Julie: "not so huge").
            img.classList.add('pg-fb-img');
            if (fb.underTitle) {
              let at = body.querySelector('h1');
              while (at && at.parentElement !== body) at = at.parentElement;
              if (at) fb.underTitle.forEach(re => {
                const el = [...body.children].find(e => re.test(e.textContent));
                if (el) { at.after(el); at = el; }
              });
            }
            // The page's own lone "Purchase Tickets" button right above the flyer is a duplicate of the row (Julie).
            const pv = blk.previousElementSibling;
            if (pv && /^\s*(purchase|buy) tickets\s*$/i.test(pv.textContent) && pv.querySelectorAll('a').length === 1) pv.hidden = true;
            body.insertBefore(row(), blk);
            const below = row();
            blk.after(below);
            // The page's own lone "Download the Flyer" button right under it is now a duplicate.
            const nx = below.nextElementSibling;
            if (nx && /^\s*download the flyer\s*$/i.test(nx.textContent) && nx.querySelectorAll('a').length === 1) nx.hidden = true;
          }
        }
        // Emoji-free pages: the sign-up sheets draw themselves in afterwards, so clean their text as it arrives.
        if ((mergeCfg()[pId] || {}).layout) {
          const clean = () => {
            const w = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
            for (let n; (n = w.nextNode());) {
              const t = n.nodeValue.replace(EMOJI, '')
                // Sabre Scarer zones as the sign-up slots have them (Julie)
                .replace(/Bloody Camp, Medical, Spiders, Witches, or Zombies/g, 'Bloody Camp/Medical, Circus/Clowns/Carnival, Witches & Spiders, or Zombies & Aliens')
                .replace(/\*\*/g, '');   // the sheets' **bold** markers aren't turned into bold, so drop them
              if (t !== n.nodeValue) n.nodeValue = t;
            }
          };
          clean();
          new MutationObserver(clean).observe(body, { childList: true, subtree: true });
        }
        if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView({ block: 'start' }), 300); }
        renderPageRelations(p, pId);
      } catch (e) {
        hero.textContent = 'Sorry';
        body.innerHTML = isPreview
          ? '<p>Could not load this page: ' + escapeHtml(e.message || String(e)) + '</p>'
          : '<p>This page could not be loaded right now.</p>';
      }
    }

    // A parent link at the top and a sub-pages list at the bottom, when this page
    // has either. Best-effort/non-fatal -- a missing or still-draft parent, or a
    // failed lookup, just means that piece doesn't show, never breaks the page itself.
    async function renderPageRelations(p, pId) {
      if (p.parentPageId) {
        try {
          const parentSnap = await db.collection('pages').doc(p.parentPageId).get();
          if (parentSnap.exists && parentSnap.data().status === 'published') {
            const parent = parentSnap.data();
            body.insertAdjacentHTML('afterbegin',
              '<p style="margin:0 0 16px"><a href="' + escapeHtml(pageHref(parent)) +
              '" style="color:var(--primary);font-weight:700;text-decoration:none">&larr; Part of: ' +
              escapeHtml(parent.title) + '</a></p>');
          }
        } catch (_) {}
      }
      if (!pId) return;
      try {
        const kidsSnap = await db.collection('pages')
          .where('parentPageId', '==', pId).where('status', '==', 'published').get();
        if (!kidsSnap.size) return;
        const merged = Object.values(mergeCfg()).map(m => m.from);   // already shown on this page
        const kidsDocs = kidsSnap.docs.filter(d => merged.indexOf(d.id) < 0);
        if (!kidsDocs.length) return;
        const items = kidsDocs.map(d => {
          const k = d.data();
          return '<li><a href="' + escapeHtml(pageHref(k)) + '" style="color:var(--primary);font-weight:600">' +
            escapeHtml(k.title) + '</a></li>';
        }).join('');
        body.insertAdjacentHTML('beforeend',
          '<div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border)">' +
          '<h3 style="margin:0 0 10px">Related pages</h3><ul style="margin:0;padding-left:20px">' + items + '</ul></div>');
      } catch (_) {}
    }

    function notFound() {
      hero.textContent = 'Page not found';
      body.innerHTML = '<p>This page may have been unpublished, or the link is mistyped. ' +
        '<a href="/index.html">Go to the Schalmont PTO home page</a>.</p>';
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  </script>
  <script src="/js/menus.js?v=5"></script>
</body>
</html>
