<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Schalmont PTO">
  <meta property="og:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <title>Schalmont PTO</title>
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <link rel="stylesheet" href="/admin/admin.css?v=8">
  <link rel="icon" href="/images/favicon.svg">
  <style>
    .pg-preview-banner { background:#8a6d1a; color:#fff; text-align:center; font-weight:700;
      font-size:13px; padding:8px 14px; }
    .page-hero h1 { margin:0; }
    .page-hero p { margin:10px 0 0; }
    #pg-body { max-width:760px; }
  </style>
  <link rel="stylesheet" href="/css/menus.css?v=5">
</head>
<body>

  <div id="preview-banner" class="pg-preview-banner" hidden>
    👁 PREVIEW — this is a draft. It is not visible to the public until you press Publish.
  </div>

  <div id="sc-header"></div>

  <div class="homepage-layout">
    <div id="sc-sidenav"></div>
    <div class="homepage-main">

      <section class="page-hero" style="background:linear-gradient(135deg,#045c28 0%,#087d40 100%)">
        <div class="container">
          <h1 id="hero-title">Loading…</h1>
          <p id="hero-sub" hidden></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="pg-body" id="pg-body"><p style="color:var(--text-light)">Loading…</p></div>
        </div>
      </section>

    </div>
  </div>

  <div id="sc-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/site-chrome.js?v=11"></script>
  <script src="/admin/render-blocks.js?v=2"></script>
  <script src="/js/signup-embed.js?v=4"></script>
  <script src="/js/photo-lightbox.js?v=2"></script>
  <script>
    renderSiteChrome();

    const PREFIX_TO_SCHOOL = { woestina:'woestina', jefferson:'jefferson', ms:'middle', hs:'high', pto:'pto' };
    const SCHOOL_LABEL = { woestina:'Woestina Pre-K', jefferson:'Jefferson Elementary',
      middle:'Middle School', high:'High School', pto:'Schalmont PTO' };
    const OWNER_EMAIL = 'julie@schalmontpto.com';
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(location.search);
    const isPreview = params.get('preview') === '1';
    const pageIdParam = params.get('id');
    let slug = params.get('slug');
    let prefix = params.get('prefix');
    if (!slug) {
      const m = location.pathname.match(/^\/(woestina|jefferson|ms|hs|pto)\/([A-Za-z0-9_-]+)/)
             || location.pathname.match(/^\/p\/([A-Za-z0-9_-]+)/)
             // A page with no school at all publishes prefix-less, schalmontpto.com/<slug> --
             // .htaccess only ever routes a bare single segment here when it isn't a real
             // static page, so this is safe to match unconditionally.
             || location.pathname.match(/^\/([A-Za-z0-9_-]+)\/?$/);
      if (m) { if (m.length === 3) { prefix = m[1]; slug = m[2]; } else { slug = m[1]; } }
    }
    const wantSchool = prefix ? PREFIX_TO_SCHOOL[prefix] : null;

    const body = document.getElementById('pg-body');
    const hero = document.getElementById('hero-title');

    const stuckTimer = setTimeout(() => {
      if (/Loading/.test(body.textContent)) {
        hero.textContent = 'Preview';
        body.innerHTML = '<p>This is taking longer than expected. Try refreshing, or make sure ' +
          'you are signed in to the back office in this browser.</p>';
      }
    }, 12000);
    const clearStuck = () => clearTimeout(stuckTimer);

    try {
      if (isPreview) {
        firebase.auth().onAuthStateChanged(async (user) => {
          clearStuck();
          if (!user) { fail('Please <a href="/login.html">sign in</a> as a PTO administrator, then reopen the preview.'); return; }
          if (!await canPreview(user)) { fail('Your account can\'t preview this page.'); return; }
          render(true);
        });
      } else { clearStuck(); render(false); }
    } catch (e) { clearStuck(); fail('Could not start: ' + escapeHtml(e.message)); }

    function fail(msgHtml) { hero.textContent = 'Preview'; body.innerHTML = '<p>' + msgHtml + '</p>'; }

    async function canPreview(user) {
      if (user.email === OWNER_EMAIL) return true;
      try {
        const d = (await db.collection('users').doc(user.uid).get()).data() || {};
        if (d.role === 'superadmin') return true;
        if (d.role === 'admin' && Array.isArray(d.adminSchools) && wantSchool)
          return d.adminSchools.includes(wantSchool);
      } catch (_) {}
      return false;
    }

    function routeOf(d) {
      const list = Array.isArray(d.schools) && d.schools.length ? d.schools
                 : (d.school ? [d.school] : []);
      if (list.length === 1) return list[0];
      return list.length === 0 ? '' : 'pto';
    }
    function pageHref(d) {
      const school = routeOf(d);
      const prefix = { woestina:'woestina', jefferson:'jefferson', middle:'ms', high:'hs', pto:'pto' }[school];
      return prefix ? '/' + prefix + '/' + d.slug : '/' + d.slug;
    }

    /* Pages combined in the site code (until it's done in the back office): the volunteer
       page's sign-up sheets are shown inside the main event page, and the old volunteer link
       forwards there (also redirected in .htaccess). */
    // (Function declarations, not consts: render() runs before this part of the script is reached.)
    function mergeCfg() { return {
      // 2026 Schalmont PTO Trail of Treats  <-  Trail of Treats Volunteer Crew
      '7Pgsdbof9URojBmTyi3J': { from: 'jykqeTbLZAowLXPJ9hr9', link: 'trail-of-treats-volunteers', skip: 2,
        anchor: 'volunteer', heading: '🎃 Volunteer Sign-Ups', fixHref: '/signup/trailrsvp',
        calloutAfter: 'Friday, October 30', callout: '🙋 We still need volunteers for Friday! Sign up below →' }
    }; }
    function sendTo() { return { 'trail-of-treats-volunteers': '/trailoftreats#volunteer' }; }

    async function mergedBody(p, pId) {
      const m = mergeCfg()[pId];
      if (!m) return renderBlocks(p.blocks);
      let extra = [];
      try {
        const d = await db.collection('pages').doc(m.from).get();
        if (d.exists && d.data().status === 'published') extra = (d.data().blocks || []).slice(m.skip || 0);
      } catch (_) {}
      if (!extra.length) return renderBlocks(p.blocks);
      const blocks = JSON.parse(JSON.stringify(p.blocks || []));
      const isLink = b => b && b.type === 'button' && String(b.href || '').indexOf(m.link) >= 0;
      const at = blocks.findIndex(isLink);
      blocks.forEach((b, i) => { if (i !== at && isLink(b)) b.href = /rsvp/i.test(b.label || '') ? m.fixHref : '/trailoftreats#' + m.anchor; });   // "RSVP" buttons -> the RSVP form
      // Buttons inside column blocks (e.g. the top "Scare Crew Signup") jump down to the sign-ups.
      (function walk(list) { (list || []).forEach(b => { if (b && b.cells) b.cells.forEach(c => walk(c.blocks)); else if (isLink(b)) b.href = /rsvp/i.test(b.label || '') ? m.fixHref : '/trailoftreats#' + m.anchor; }); })(blocks);
      const section = '<section id="' + m.anchor + '" style="scroll-margin-top:100px;margin:28px 0;padding:22px 18px;border:3px solid #f57914;border-radius:16px;background:#fff8f0">' +
        '<h2 style="text-align:center;margin:0 0 12px">' + m.heading + '</h2>' + renderBlocks(extra) + '</section>';
      const before = at >= 0 ? blocks.slice(0, at) : blocks, after = at >= 0 ? blocks.slice(at + 1) : [];
      const ci = before.findIndex(b => String(b.text || '').indexOf(m.calloutAfter) >= 0);
      const callout = '<p style="text-align:center;margin:18px 0"><a href="#' + m.anchor + '" style="display:inline-block;background:#f57914;color:#fff;font-weight:800;font-size:18px;padding:14px 24px;border-radius:999px;text-decoration:none">' + m.callout + '</a></p>';
      const top = ci >= 0 ? renderBlocks(before.slice(0, ci + 1)) + callout + renderBlocks(before.slice(ci + 1)) : callout + renderBlocks(before);
      return top + section + renderBlocks(after);
    }

    async function render(preview) {
      try {
        if (!preview && !pageIdParam && sendTo()[slug]) { location.replace(sendTo()[slug]); return; }
        let p = null, pId = null;
        if (pageIdParam) {
          const doc = await db.collection('pages').doc(pageIdParam).get();
          if (doc.exists && (preview || doc.data().status === 'published')) { p = doc.data(); pId = doc.id; }
        } else {
          if (!slug) { notFound(); return; }
          // Firestore denies an entire query (not just the non-matching docs) if any
          // document it could return would fail the security rule for this reader --
          // so an anonymous visitor's query must filter on status itself, matching
          // the rule, or a draft sharing the same slug makes the whole lookup fail.
          let query = db.collection('pages').where('slug', '==', slug);
          if (!preview) query = query.where('status', '==', 'published');
          const snap = await query.get();
          const hit = snap.docs.find(d => (preview || d.data().status === 'published') && (!wantSchool || routeOf(d.data()) === wantSchool));
          if (hit) { p = hit.data(); pId = hit.id; }
          if (!p) {
            // No page has this as its current slug -- maybe it used to, before the page's
            // own link changed, or it's an alias the admin added on purpose. Redirects live
            // in their own page_redirects/<slug> doc (see admin/page-editor.html's
            // syncRedirects()), so this is a plain doc-id lookup -- no query, no index,
            // and no security-rule gymnastics over which drafts a query could touch.
            const rdoc = await db.collection('page_redirects').doc(slug).get();
            if (rdoc.exists) {
              const targetSnap = await db.collection('pages').doc(rdoc.data().pageId).get();
              if (targetSnap.exists && (preview || targetSnap.data().status === 'published')) {
                location.replace(pageHref(targetSnap.data()));
                return;
              }
            }
          }
        }
        // Pages taken off the public site even though still published in the back office.
        if (!preview && p && /^trunk or treat 2026$/i.test(String(p.title || '').trim())) p = null;
        if (!p) { notFound(); return; }

        document.title = p.title + ' — Schalmont PTO';
        hero.textContent = p.title || 'Untitled page';
        if (preview && p.status !== 'published') document.getElementById('preview-banner').hidden = false;
        body.innerHTML = renderPageHeader(p) + await mergedBody(p, pId);
        mountSignupEmbeds(db);
        if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView({ block: 'start' }), 300); }
        renderPageRelations(p, pId);
      } catch (e) {
        hero.textContent = 'Sorry';
        body.innerHTML = isPreview
          ? '<p>Could not load this page: ' + escapeHtml(e.message || String(e)) + '</p>'
          : '<p>This page could not be loaded right now.</p>';
      }
    }

    // A parent link at the top and a sub-pages list at the bottom, when this page
    // has either. Best-effort/non-fatal -- a missing or still-draft parent, or a
    // failed lookup, just means that piece doesn't show, never breaks the page itself.
    async function renderPageRelations(p, pId) {
      if (p.parentPageId) {
        try {
          const parentSnap = await db.collection('pages').doc(p.parentPageId).get();
          if (parentSnap.exists && parentSnap.data().status === 'published') {
            const parent = parentSnap.data();
            body.insertAdjacentHTML('afterbegin',
              '<p style="margin:0 0 16px"><a href="' + escapeHtml(pageHref(parent)) +
              '" style="color:var(--primary);font-weight:700;text-decoration:none">&larr; Part of: ' +
              escapeHtml(parent.title) + '</a></p>');
          }
        } catch (_) {}
      }
      if (!pId) return;
      try {
        const kidsSnap = await db.collection('pages')
          .where('parentPageId', '==', pId).where('status', '==', 'published').get();
        if (!kidsSnap.size) return;
        const merged = Object.values(mergeCfg()).map(m => m.from);   // already shown on this page
        const kidsDocs = kidsSnap.docs.filter(d => merged.indexOf(d.id) < 0);
        if (!kidsDocs.length) return;
        const items = kidsDocs.map(d => {
          const k = d.data();
          return '<li><a href="' + escapeHtml(pageHref(k)) + '" style="color:var(--primary);font-weight:600">' +
            escapeHtml(k.title) + '</a></li>';
        }).join('');
        body.insertAdjacentHTML('beforeend',
          '<div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border)">' +
          '<h3 style="margin:0 0 10px">Related pages</h3><ul style="margin:0;padding-left:20px">' + items + '</ul></div>');
      } catch (_) {}
    }

    function notFound() {
      hero.textContent = 'Page not found';
      body.innerHTML = '<p>This page may have been unpublished, or the link is mistyped. ' +
        '<a href="/index.html">Go to the Schalmont PTO home page</a>.</p>';
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  </script>
  <script src="/js/menus.js?v=3"></script>
</body>
</html>
