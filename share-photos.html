<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Share Your Photos with the Schalmont PTO">
  <meta property="og:description" content="Send your school event photos to the PTO for the yearbooks, the website and our newsletters.">
  <meta property="og:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <meta property="og:url" content="https://schalmontpto.com/share-photos">
  <meta property="og:type" content="website">
  <meta name="description" content="Send your Schalmont school event photos to the PTO for the yearbooks, the website and newsletters.">
  <title>Share Your Photos — Schalmont PTO</title>
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <link rel="icon" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/yearbook-form.css?v=7">
  <style>
    .sp-card { max-width: 820px; margin: 0 auto; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: clamp(18px, 4vw, 32px); }
    .sp-intro { max-width: 820px; margin: 0 auto 18px; color: var(--text); font-size: 15px; line-height: 1.65; }
  </style>
  <link rel="stylesheet" href="/css/menus.css?v=3">
</head>
<body>

  <div id="sc-header"></div>

  <div class="homepage-layout">
    <div id="sc-sidenav"></div>
    <div class="homepage-main">

      <section class="page-hero" style="background:linear-gradient(135deg,#002F20 0%,#007A3D 100%)">
        <div class="container">
          <h1 style="margin:0">📷 Share Your Photos</h1>
          <p style="margin:10px 0 0">Took great pictures at a school event? Send them to the PTO.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <p class="sp-intro">Your photos help fill the school yearbooks and share what's happening at Schalmont on our website and in PTO newsletters. Tell us who's in each photo and their school and grade, and pick the event if you know it.</p>
          <div class="sp-card">
            <div data-yearbook-form data-school=""></div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <div id="sc-footer"></div>

  <script src="/js/site-chrome.js?v=5"></script>
  <script>renderSiteChrome();</script>
  <script src="/js/yearbook-form.js?v=15"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/menus.js?v=1"></script>
</body>
</html>
