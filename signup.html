<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Sign Up — Schalmont PTO">
  <meta property="og:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://schalmontpto.com/images/Schalmont-PTO-logo.png">
  <title>Sign Up — Schalmont PTO</title>
  <link rel="stylesheet" href="css/styles.css?v=6">
  <link rel="icon" href="images/favicon.svg">
  <style>
    .page-hero h1 { margin:0; }
    .page-hero p { margin:8px 0 0; opacity:.92; }
    #app { max-width:720px; }
    .su-intro { color: var(--text); line-height: 1.6; white-space: pre-wrap; margin: 0 0 22px; }
    .su-closed { background:#fdecea; border:1px solid #f5c6c0; color:#8b1a14; padding:14px 16px; border-radius:10px; font-weight:600; margin-bottom:20px; }
    .su-grid { display:grid; gap:14px; margin-bottom:4px; }
    .su-grid .su-slot { margin-bottom:0; }
    .su-grid-2 { grid-template-columns:repeat(2,1fr); }
    .su-grid-3 { grid-template-columns:repeat(3,1fr); }
    .su-grid-4 { grid-template-columns:repeat(4,1fr); }
    @media (max-width:900px) { .su-grid-3, .su-grid-4 { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:560px) { .su-grid-2, .su-grid-3, .su-grid-4 { grid-template-columns:1fr; } }
    .su-slot { border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; background:#fff; box-shadow:var(--shadow); }
    .su-slot h3 { margin:0 0 3px; font-size:17px; color:var(--primary-dark); }
    .su-when { font-size:13.5px; color:var(--text-light); margin-bottom:8px; }
    .su-spots { font-size:13.5px; font-weight:700; margin-bottom:8px; }
    .su-spots.full { color:#8b1a14; }
    .su-spots.ok { color:#2a5c1e; }
    .su-names { font-size:13px; color:var(--text); margin-bottom:10px; }
    .su-names span { display:inline-block; background:var(--light-bg); border:1px solid var(--border); border-radius:20px; padding:2px 10px; margin:2px 3px 0 0; }
    .su-open { display:inline-block; padding:7px 16px; font-size:13px; font-weight:700; font-family:inherit; background:#fff; color:var(--primary); border:2px solid var(--primary); border-radius:var(--radius); cursor:pointer; }
    .su-open:hover { background:var(--primary); color:#fff; }
    .su-mine { font-size:13px; color:var(--text); background:var(--light-bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:4px; }
    .su-cancel, .su-edit { font-family:inherit; font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; cursor:pointer; margin-left:4px; }
    .su-edit { background:#fff; color:var(--primary); border:1.5px solid var(--primary); }
    .su-edit:hover { background:var(--primary); color:#fff; }
    .su-cancel { background:#fff; color:#8b1a14; border:1.5px solid #d98a83; }
    .su-cancel:hover { background:#8b1a14; color:#fff; border-color:#8b1a14; }
    .su-submit { display:inline-block; padding:11px 24px; font-size:14px; font-weight:700; font-family:inherit; background:var(--secondary); color:var(--primary-dark); border:2px solid var(--secondary); border-radius:var(--radius); cursor:pointer; }
    .su-submit:hover { background:var(--secondary-dark); border-color:var(--secondary-dark); }
    .su-submit:disabled { opacity:.6; cursor:default; }
    .su-form { display:none; border-top:1px dashed var(--border); margin-top:12px; padding-top:14px; }
    .su-form.open { display:block; }
    .su-form label { display:block; font-size:12px; font-weight:700; margin:8px 0 3px; }
    .su-form input { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:7px; font-family:inherit; font-size:14px; }
    .su-row2 { display:flex; gap:10px; flex-wrap:wrap; }
    .su-row2 > div { flex:1; min-width:140px; }
    .su-msg { margin-top:10px; font-size:13px; font-weight:600; }
    .su-done { color:#2a5c1e; }
    .su-err { color:#8b1a14; }
    body.embed .site-header, body.embed .homepage-sidenav, body.embed .site-footer { display:none !important; }
    body.embed .homepage-layout { display:block; }
    body.embed .homepage-main { padding:0; }
    body.embed .page-hero { padding:18px 0; }
  </style>
</head>
<body>

  <div id="sc-header"></div>
  <div class="homepage-layout">
    <div id="sc-sidenav"></div>
    <div class="homepage-main">

      <section class="page-hero" style="background:linear-gradient(135deg,#045c28 0%,#087d40 100%)">
        <div class="container">
          <h1 id="su-title">Sign Up</h1>
          <p id="su-contact" hidden></p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="app"><p style="color:var(--text-light)">Loading…</p></div>
        </div>
      </section>

    </div>
  </div>
  <div id="sc-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/site-chrome.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var ID = params.get('id');
    if (params.get('embed') === '1') document.body.classList.add('embed');
    renderSiteChrome();
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();
    var app = document.getElementById('app');
    var titleEl = document.getElementById('su-title');
    var contactEl = document.getElementById('su-contact');

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function prettyDate(ymd) {
      if (!ymd) return '';
      var p = ymd.split('-'); if (p.length !== 3) return ymd;
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      return isNaN(d) ? ymd : d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }
    function prettyTime(hm) {
      if (!hm) return ''; var p = hm.split(':'); if (p.length < 2) return hm;
      var h = +p[0], ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
      return h + ':' + p[1] + ' ' + ap;
    }

    // ---- "my signups" (per-browser, per-sheet) ----
    function mineKey(id) { return 'pto_su_mine_' + id; }
    function getMine(id) {
      try { return JSON.parse(localStorage.getItem(mineKey(id)) || '[]'); } catch (e) { return []; }
    }
    function setMine(id, list) {
      try { localStorage.setItem(mineKey(id), JSON.stringify(list)); } catch (e) { /* ignore */ }
    }
    function rememberMine(id, entry) {
      var list = getMine(id).filter(function (m) { return m.entryId !== entry.entryId; });
      list.push(entry);
      setMine(id, list);
    }
    function forgetMine(id, entryId) {
      setMine(id, getMine(id).filter(function (m) { return m.entryId !== entryId; }));
    }

    if (!ID) { app.innerHTML = '<p class="su-err">Missing sign-up link.</p>'; }
    else load();

    function load() {
      db.collection('signups').doc(ID).get().then(function (snap) {
        if (!snap.exists) { app.innerHTML = '<p class="su-err">This sign-up sheet was not found.</p>'; return; }
        var sheet = snap.data();
        Promise.all([
          db.collection('signups').doc(ID).collection('slots').orderBy('order').get(),
          db.collection('signups').doc(ID).collection('entries').get()
        ]).then(function (res) {
          render(sheet, res[0].docs, res[1].docs);
        });
      }).catch(function (e) { app.innerHTML = '<p class="su-err">Could not load this sheet. ' + esc(e.message) + '</p>'; });
    }

    function loadWithPrefill(slotId, priorFields) {
      db.collection('signups').doc(ID).get().then(function (snap) {
        var sheet = snap.data();
        Promise.all([
          db.collection('signups').doc(ID).collection('slots').orderBy('order').get(),
          db.collection('signups').doc(ID).collection('entries').get()
        ]).then(function (res) {
          render(sheet, res[0].docs, res[1].docs, {
            slotId: slotId, open: true,
            name: priorFields.name, email: priorFields.email, phone: priorFields.phone, comment: priorFields.comment, item: priorFields.item
          });
        });
      });
    }

    function render(sheet, slotDocs, entryDocs, prefill) {
      var byName = {};
      var liveIds = {};
      entryDocs.forEach(function (d) {
        var e = d.data();
        liveIds[d.id] = !e.cancelled;
        if (e.cancelled) return;
        (byName[e.slotId] = byName[e.slotId] || []).push({ name: e.name, count: e.count || 1, item: e.item || '' });
      });
      var mine = getMine(ID).filter(function (m) { return liveIds[m.entryId]; });
      setMine(ID, mine);
      var mineBySlot = {};
      mine.forEach(function (m) { mineBySlot[m.slotId] = m; });
      var closed = sheet.status === 'closed';
      document.title = (sheet.title || 'Sign Up') + ' — Schalmont PTO';
      titleEl.textContent = sheet.title || 'Sign Up';
      if (sheet.contactName || sheet.contactEmail) {
        contactEl.hidden = false;
        contactEl.innerHTML = 'Questions? ' + esc(sheet.contactName || '') +
          (sheet.contactEmail ? ' &middot; <a href="mailto:' + esc(sheet.contactEmail) + '" style="color:#fff;text-decoration:underline">' + esc(sheet.contactEmail) + '</a>' : '');
      }

      var cols = [2, 3, 4].indexOf(sheet.columns) !== -1 ? sheet.columns : 1;

      var html = '';
      if (sheet.intro) html += '<p class="su-intro">' + esc(sheet.intro) + '</p>';
      if (closed) html += '<div class="su-closed">This sign-up sheet is closed.</div>';
      if (!slotDocs.length) html += '<p style="color:var(--text-light)">No slots have been added yet.</p>';

      if (cols > 1) html += '<div class="su-grid su-grid-' + cols + '">';
      slotDocs.forEach(function (d) {
        var s = d.data(), taken = s.taken || 0, cap = s.capacity || 0;
        var left = cap ? Math.max(0, cap - taken) : null;
        var full = cap && left <= 0;
        var when = [prettyDate(s.date), [prettyTime(s.start), prettyTime(s.end)].filter(Boolean).join('–')].filter(Boolean).join(' · ');
        var names = (byName[d.id] || []).map(function (n) {
          return '<span>' + esc(n.name) + (n.count > 1 ? ' (' + n.count + ')' : '') + (n.item ? ' — ' + esc(n.item) : '') + '</span>';
        }).join('');
        var myEntry = mineBySlot[d.id];
        html += '<div class="su-slot" data-slot="' + d.id + '">';
        html += '<h3>' + esc(s.label || 'Slot') + '</h3>';
        if (when) html += '<div class="su-when">' + esc(when) + '</div>';
        html += '<div class="su-spots ' + (full ? 'full' : 'ok') + '">' +
          (cap ? (full ? 'Full' : left + ' of ' + cap + ' spot' + (cap === 1 ? '' : 's') + ' left') : (taken ? taken + ' signed up' : 'Open — sign up below')) + '</div>';
        if (names) html += '<div class="su-names">' + names + '</div>';
        if (myEntry) {
          html += '<div class="su-mine">You\'re signed up as <strong>' + esc(myEntry.name) + '</strong> ' +
            '<button type="button" class="su-edit" data-entry="' + esc(myEntry.entryId) + '">Edit</button> ' +
            '<button type="button" class="su-cancel" data-entry="' + esc(myEntry.entryId) + '">Cancel</button></div>';
        } else if (!closed && !full) {
          html += '<button class="su-open">Sign up</button>';
        }
        if (!myEntry && !closed && (!full || (prefill && prefill.slotId === d.id))) {
          html += formHtml(prefill && prefill.slotId === d.id ? prefill : null, sheet.askItem !== false);
        }
        html += '</div>';
      });
      if (cols > 1) html += '</div>';
      app.innerHTML = html;

      app.querySelectorAll('.su-open').forEach(function (b) {
        b.onclick = function () { b.nextElementSibling.classList.toggle('open'); };
      });
      app.querySelectorAll('.su-form').forEach(function (form) {
        form.onsubmit = function (ev) { ev.preventDefault(); submit(form); };
        if (form.classList.contains('open')) form.name.focus();
      });
      app.querySelectorAll('.su-cancel').forEach(function (b) {
        b.onclick = function () { cancelClicked(b.closest('.su-slot').dataset.slot, b.dataset.entry, false); };
      });
      app.querySelectorAll('.su-edit').forEach(function (b) {
        b.onclick = function () { cancelClicked(b.closest('.su-slot').dataset.slot, b.dataset.entry, true); };
      });
    }

    function formHtml(prefill, askItem) {
      prefill = prefill || {};
      return '<form class="su-form' + (prefill.open ? ' open' : '') + '">' +
        '<label>Your name</label><input name="name" required maxlength="80" placeholder="First and last name" value="' + esc(prefill.name || '') + '">' +
        '<label>Email</label><input name="email" type="email" required value="' + esc(prefill.email || '') + '">' +
        '<div class="su-row2">' +
          '<div><label>Phone</label><input name="phone" required value="' + esc(prefill.phone || '') + '"></div>' +
          '<div><label>Note to organizer <span style="font-weight:400;color:var(--text-light)">(optional)</span></label><input name="comment" maxlength="200" value="' + esc(prefill.comment || '') + '"></div>' +
        '</div>' +
        (askItem ? '<label>What are you bringing? <span style="font-weight:400;color:var(--text-light)">(optional)</span></label><input name="item" maxlength="100" placeholder="e.g. A dozen cookies" value="' + esc(prefill.item || '') + '">' : '') +
        '<div style="margin-top:12px"><button type="submit" class="su-submit">Sign me up</button></div>' +
        '<div class="su-msg"></div>' +
      '</form>';
    }

    function submit(form) {
      var slotEl = form.closest('.su-slot');
      var slotId = slotEl.dataset.slot;
      var name = form.name.value.trim();
      var count = 1;   // one sign-up = one spot; people no longer pick how many
      var email = form.email.value.trim(), phone = form.phone.value.trim(), comment = form.comment.value.trim();
      var item = form.item ? form.item.value.trim() : '';
      var msg = form.querySelector('.su-msg');
      if (!name || !email || !phone) {
        msg.className = 'su-msg su-err'; msg.textContent = 'Name, email and phone are all required.'; return;
      }
      var btn = form.querySelector('button[type=submit]'); btn.disabled = true;
      msg.className = 'su-msg'; msg.textContent = 'Saving…';

      var slotRef = db.collection('signups').doc(ID).collection('slots').doc(slotId);
      var newEntryId = null;
      db.runTransaction(function (tx) {
        return tx.get(slotRef).then(function (s) {
          if (!s.exists) throw new Error('That slot is no longer available.');
          var d = s.data(), taken = d.taken || 0;
          if (d.capacity && taken + count > d.capacity) throw new Error('Sorry — not enough spots left.');
          tx.update(slotRef, { taken: taken + count });
          var eref = db.collection('signups').doc(ID).collection('entries').doc();
          newEntryId = eref.id;
          tx.set(eref, { slotId: slotId, name: name, count: count, item: item, at: firebase.firestore.FieldValue.serverTimestamp() });
          tx.set(db.collection('signups').doc(ID).collection('contacts').doc(eref.id),
            { email: email, phone: phone, comment: comment });
        });
      }).then(function () {
        rememberMine(ID, { entryId: newEntryId, slotId: slotId, name: name, email: email, phone: phone, comment: comment, item: item });
        msg.className = 'su-msg su-done'; msg.textContent = '✓ You\'re signed up. Thank you!';
        setTimeout(load, 900);
      }).catch(function (e) {
        btn.disabled = false;
        msg.className = 'su-msg su-err'; msg.textContent = e.message || 'Something went wrong — please try again.';
      });
    }

    function cancelClicked(slotId, entryId, asEdit) {
      var email = window.prompt('To ' + (asEdit ? 'edit' : 'cancel') + ' this sign-up, please re-enter the email you used:');
      if (email == null) return;
      email = email.trim();
      if (!email) return;
      var entryRef = db.collection('signups').doc(ID).collection('entries').doc(entryId);
      var slotRef = db.collection('signups').doc(ID).collection('slots').doc(slotId);
      var priorCount = 1, priorFields = null;
      entryRef.get().then(function (snap) {
        if (!snap.exists) throw new Error('That sign-up was already removed.');
        priorCount = snap.data().count || 1;
        var mine = getMine(ID).filter(function (m) { return m.entryId === entryId; })[0];
        priorFields = mine || {};
        return entryRef.update({ cancelled: true, checkEmail: email });
      }).then(function () {
        return slotRef.get();
      }).then(function (slotSnap) {
        var taken = (slotSnap.data() || {}).taken || 0;
        return slotRef.update({ taken: Math.max(0, taken - priorCount), lastCancelEid: entryId });
      }).then(function () {
        return entryRef.update({ takenReverted: true });
      }).then(function () {
        forgetMine(ID, entryId);
        if (asEdit) { loadWithPrefill(slotId, priorFields); } else { load(); }
      }).catch(function (e) {
        window.alert(e.code === 'permission-denied'
          ? 'That email doesn\'t match what you signed up with.'
          : (e.message || 'Something went wrong — please try again.'));
      });
    }
  </script>
</body>
</html>
